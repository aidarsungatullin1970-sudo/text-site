<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ текста</title>

<style>
body {
    font-family: Arial;
    background: #0b1c2c;
    color: white;
    text-align: center;
    padding: 30px;
}

textarea {
    width: 80%;
    height: 150px;
    padding: 10px;
}

button {
    margin: 10px;
    padding: 12px 20px;
    border: none;
    cursor: pointer;
}

.ai { background: #00c2ff; }
.limit { background: #ff4d4d; }

#result {
    margin-top: 20px;
    background: white;
    color: black;
    padding: 20px;
}
</style>
</head>

<body>

<h1>Проверь и усили свой текст</h1>

<textarea id="text"></textarea>
<br>

<button onclick="analyzeText()">Анализ</button>
<button class="ai" onclick="askAI()">Сделать лучше (ИИ)</button>

<div id="result"></div>

<p id="limitInfo"></p>

<script>

// ====== ЛИМИТЫ ======
let limit = localStorage.getItem("limit") || 3;

function updateLimit() {
    document.getElementById("limitInfo").innerHTML =
        "Осталось попыток: " + limit;
}
updateLimit();


// ====== АНАЛИЗ ======
function analyzeText() {
    let text = document.getElementById("text").value;

    let result = "<h3>🔍 Анализ:</h3>";

    if (text.length > 200) {
        result += "<p>❌ Перегружен</p>";
    } else {
        result += "<p>✅ Норм</p>";
    }

    document.getElementById("result").innerHTML = result;
}


// ====== ИИ ======
async function askAI() {
    let text = document.getElementById("text").value;

    if (!text) {
        alert("Вставь текст");
        return;
    }

    if (limit <= 0) {
        document.getElementById("result").innerHTML =
            "<h3>❌ Лимит закончился</h3><p>Купите доступ</p>";
        return;
    }

    limit--;
    localStorage.setItem("limit", limit);
    updateLimit();

    document.getElementById("result").innerHTML = "⏳ Думаю...";

    let response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
            "Authorization": "Bearer ТВОЙ_API_КЛЮЧ",
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            model: "openai/gpt-4o-mini",
            messages: [
                {
                    role: "user",
                    content: "Сделай текст проще, сильнее и понятнее: " + text
                }
            ]
        })
    });

    let data = await response.json();

    let answer = data.choices[0].message.content;

    document.getElementById("result").innerHTML =
        "<h3>🤖 ИИ ответ:</h3><p>" + answer + "</p>";
}


// ====== КНОПКА ПРОДАЖИ ======
function buyAccess() {
    window.location.href = "https://t.me/your_telegram";
}

</script>

<br>

<button class="limit" onclick="buyAccess()">Купить доступ</button>

</body>
</html>
