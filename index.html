<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ текста</title>

<style>
body {
    font-family: Arial;
    background: #0b1c2c;
    color: white;
    text-align: center;
    padding: 30px;
}

textarea {
    width: 80%;
    height: 150px;
    padding: 10px;
}

button {
    margin: 10px;
    padding: 10px 20px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    background: white;
    color: black;
    padding: 15px;
}
</style>
</head>

<body>

<h1>Проверь и усили свой текст</h1>

<textarea id="inputText" placeholder="Вставь текст..."></textarea><br>

<button onclick="improveText()">Сделать лучше (ИИ)</button>

<div id="result"></div>

<script>
async function improveText() {
    let text = document.getElementById("inputText").value;

    document.getElementById("result").innerText = "Думаю...";

    try {
        let response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": "Bearer sk-or-v1-ВСТАВЬ_СЮДА_КЛЮЧ",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "openai/gpt-4o-mini",
                messages: [
                    {
                        role: "user",
                        content: "Сделай текст проще, сильнее и понятнее:\n\n" + text
                    }
                ]
            })
        });

        let data = await response.json();

        if (data.choices && data.choices.length > 0) {
            document.getElementById("result").innerText =
                data.choices[0].message.content;
        } else {
            document.getElementById("result").innerText =
                "Ошибка: нет ответа от ИИ";
        }

    } catch (error) {
        document.getElementById("result").innerText =
            "Ошибка запроса: " + error;
    }
}
</script>

</body>
</html>
