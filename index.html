<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Анализ текста</title>

<style>
body {
  font-family: Arial;
  background: #0b1c2c;
  color: white;
  text-align: center;
  padding: 30px;
}

textarea {
  width: 80%;
  height: 150px;
  padding: 10px;
}

button {
  margin: 10px;
  padding: 10px 20px;
  cursor: pointer;
}

#result {
  margin-top: 20px;
  background: #eee;
  color: black;
  padding: 20px;
}
</style>
</head>

<body>

<h1>Проверь и усили свой текст</h1>

<textarea id="text" placeholder="Вставь текст сюда..."></textarea><br>

<button onclick="improveText()">Сделать лучше (ИИ)</button>

<div id="result"></div>

<script>
async function improveText() {
  const text = document.getElementById("text").value;

  if (!text) {
    alert("Вставь текст");
    return;
  }

  document.getElementById("result").innerText = "Думаю...";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ text })
    });

    const data = await response.json();

    document.getElementById("result").innerText =
      data.result || "Ошибка: нет ответа";

  } catch (error) {
    document.getElementById("result").innerText =
      "Ошибка запроса";
  }
}
</script>

</body>
</html>
