<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Разбор текста</title>

<style>
body {
    font-family: Arial;
    background: #F8F9FB;
    color: #111;
    margin: 0;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 30px;
}

h1 {
    font-size: 28px;
}

textarea {
    width: 100%;
    height: 150px;
    padding: 10px;
}

button {
    background: #2EC4B6;
    color: white;
    padding: 15px;
    border: none;
    margin-top: 10px;
    width: 100%;
}

.result {
    margin-top: 20px;
    background: white;
    padding: 15px;
}
</style>

</head>

<body>

<div class="container">

<h1>Проверь свой текст</h1>

<p>Вставь текст и посмотри, где он перегружен</p>

<textarea id="text"></textarea>

<button onclick="analyze()">Разобрать текст</button>

<div id="result" class="result"></div>

</div>

<script>
function analyze() {
    let text = document.getElementById("text").value;

    if (!text) {
        alert("Вставь текст");
        return;
    }

    document.getElementById("result").innerHTML =
    "🔍 Анализ:<br><br>" +
    "1. Есть перегруз<br>" +
    "2. Есть сложные формулировки<br>" +
    "3. Местами теряется мысль<br><br>" +
    "👉 Полный разбор покажет точные места<br><br>" +
    "<a href='https://t.me/ТВОЙ_НИК'>👉 Получить полный разбор</a>";
}
</script>

</body>
</html>
