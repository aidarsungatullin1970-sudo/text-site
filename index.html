<!DOCTYPE html>

    <div class="card">
      <h2>Что мы делаем</h2>
      <p>Помогаем запускать сайты и получать заявки быстро и без лишнего.</p>
    </div>

    <div class="card">
      <h2>Почему мы</h2>
      <p>Минимум слов — максимум результата.</p>
    </div>

</html>
